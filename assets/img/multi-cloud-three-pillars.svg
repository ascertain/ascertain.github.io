<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Segoe UI, sans-serif">
  <!-- Background -->
  <rect width="800" height="350" fill="#0d1117" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">The Three Pillars: Cost · Performance · Recovery</text>
  
  <!-- Pillar 1: Cost -->
  <rect x="30" y="60" width="230" height="270" rx="10" fill="#1c1e24" stroke="#f78166" stroke-width="2"/>
  <circle cx="145" cy="100" r="25" fill="#f78166" opacity="0.2"/>
  <text x="145" y="107" text-anchor="middle" fill="#f78166" font-size="22">💰</text>
  <text x="145" y="145" text-anchor="middle" fill="#ffa657" font-size="13" font-weight="bold">COST</text>
  <text x="145" y="170" text-anchor="middle" fill="#e6edf3" font-size="11">Egress fees are the</text>
  <text x="145" y="188" text-anchor="middle" fill="#e6edf3" font-size="11">#1 hidden multi-cloud cost</text>
  <line x1="60" y1="205" x2="230" y2="205" stroke="#30363d" stroke-width="1"/>
  <text x="145" y="228" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">✅ FIX</text>
  <text x="145" y="250" text-anchor="middle" fill="#8b949e" font-size="10">Keep compute near data</text>
  <text x="145" y="268" text-anchor="middle" fill="#8b949e" font-size="10">FinOps tooling</text>
  <text x="145" y="286" text-anchor="middle" fill="#8b949e" font-size="10">(CloudHealth / Kubecost)</text>
  <text x="145" y="310" text-anchor="middle" fill="#da3633" font-size="10">Savings: 30-60%</text>
  
  <!-- Pillar 2: Performance -->
  <rect x="285" y="60" width="230" height="270" rx="10" fill="#1c1e24" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="400" cy="100" r="25" fill="#58a6ff" opacity="0.2"/>
  <text x="400" y="107" text-anchor="middle" fill="#58a6ff" font-size="22">⚡</text>
  <text x="400" y="145" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">PERFORMANCE</text>
  <text x="400" y="170" text-anchor="middle" fill="#e6edf3" font-size="11">Public internet between</text>
  <text x="400" y="188" text-anchor="middle" fill="#e6edf3" font-size="11">clouds = terrible latency</text>
  <line x1="315" y1="205" x2="485" y2="205" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="228" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">✅ FIX</text>
  <text x="400" y="250" text-anchor="middle" fill="#8b949e" font-size="10">Direct Connect (AWS)</text>
  <text x="400" y="268" text-anchor="middle" fill="#8b949e" font-size="10">ExpressRoute (Azure)</text>
  <text x="400" y="286" text-anchor="middle" fill="#8b949e" font-size="10">Interconnect (GCP)</text>
  <text x="400" y="310" text-anchor="middle" fill="#3fb950" font-size="10">Sub-ms latency</text>
  
  <!-- Pillar 3: Recovery -->
  <rect x="540" y="60" width="230" height="270" rx="10" fill="#1c1e24" stroke="#a371f7" stroke-width="2"/>
  <circle cx="655" cy="100" r="25" fill="#a371f7" opacity="0.2"/>
  <text x="655" y="107" text-anchor="middle" fill="#a371f7" font-size="22">🛡️</text>
  <text x="655" y="145" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">RECOVERY</text>
  <text x="655" y="170" text-anchor="middle" fill="#e6edf3" font-size="11">Cloud-to-cloud DR</text>
  <text x="655" y="188" text-anchor="middle" fill="#e6edf3" font-size="11">= ultimate resilience</text>
  <line x1="570" y1="205" x2="740" y2="205" stroke="#30363d" stroke-width="1"/>
  <text x="655" y="228" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="bold">✅ FIX</text>
  <text x="655" y="250" text-anchor="middle" fill="#8b949e" font-size="10">Immutable backups (S3)</text>
  <text x="655" y="268" text-anchor="middle" fill="#8b949e" font-size="10">Secondary app in Azure/GCP</text>
  <text x="655" y="286" text-anchor="middle" fill="#8b949e" font-size="10">Instant traffic failover</text>
  <text x="655" y="310" text-anchor="middle" fill="#3fb950" font-size="10">RTO &lt; 15 min</text>
</svg>
